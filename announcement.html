<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="公告详情 - 科技城存档 3.0">
    <title>公告详情 - 科技城存档 3.0</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #050508;
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.72);
            --text-muted: rgba(255, 255, 255, 0.47);
            --glass-border: rgba(255, 255, 255, 0.09);
            --card-bg: rgba(255, 255, 255, 0.03);
            --accent: #A78BFA;
            --accent-soft: rgba(167, 139, 250, 0.12);
            --accent-border: rgba(167, 139, 250, 0.45);
            --font-main: 'Inter', 'Noto Sans SC', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            --font-mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font-main);
            background: var(--bg);
            color: var(--text-primary);
            line-height: 1.7;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            letter-spacing: 0.012em;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(700px 420px at 12% -6%, rgba(124, 58, 237, 0.10), transparent 65%),
                radial-gradient(760px 460px at 88% -10%, rgba(124, 58, 237, 0.08), transparent 65%);
        }

        a { color: inherit; text-decoration: none; }
        .container { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

        /* 星空 */
        #starfield { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        .star {
            position: absolute; border-radius: 50%; background: #fff;
            animation: twinkle var(--d, 4s) ease-in-out infinite alternate;
        }
        @keyframes twinkle {
            from { opacity: calc(var(--o, 0.5) * 0.2); }
            to   { opacity: var(--o, 0.5); }
        }
        .sparkle {
            position: absolute; background: #E4C7FF;
            clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%);
            filter: drop-shadow(0 0 6px rgba(216, 180, 254, 0.9));
            animation: twinkle var(--d, 5s) ease-in-out infinite alternate;
        }

        /* 导航 */
        .navbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            background: rgba(6, 6, 12, 0.78);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }
        .navbar .container { display: flex; align-items: center; height: 66px; gap: 18px; }
        .navbar-brand { display: flex; align-items: center; gap: 9px; flex-shrink: 0; }
        .navbar-brand svg { width: 24px; height: 24px; }
        .navbar-brand .name { font-weight: 600; font-size: 1.02rem; }
        .nav-back {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 9px 18px;
            border-radius: 9px;
            font-size: 0.84rem;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.28);
            background: rgba(255, 255, 255, 0.02);
            transition: all 0.25s ease;
        }
        .nav-back:hover { border-color: rgba(255, 255, 255, 0.55); background: rgba(255, 255, 255, 0.06); }

        main { position: relative; z-index: 5; flex: 1; padding: 130px 0 90px; }

        .detail-wrap { max-width: 780px; margin: 0 auto; }
        .back-link {
            display: inline-block;
            margin-bottom: 18px;
            color: var(--text-muted);
            font-size: 0.84rem;
            transition: color 0.25s;
        }
        .back-link:hover { color: var(--accent); }

        .detail-head { text-align: center; margin-bottom: 30px; }
        .detail-head .tag {
            display: inline-block;
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--accent);
            background: var(--accent-soft);
            border: 1px solid rgba(167, 139, 250, 0.25);
            border-radius: 999px;
            padding: 5px 15px;
            margin-bottom: 16px;
        }
        .detail-head h1 {
            font-size: clamp(1.4rem, 3vw, 1.9rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.4;
            margin-bottom: 10px;
        }
        .detail-head .date {
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 0.78rem;
            letter-spacing: 0.05em;
        }
        .detail-head .date .cat-chip {
            display: inline-block;
            font-size: 0.66rem;
            font-weight: 600;
            padding: 2px 9px;
            border-radius: 999px;
            margin-right: 8px;
            letter-spacing: 0.04em;
            font-family: var(--font-body, inherit);
        }
        .cat-chip.cat-site { background: rgba(96, 165, 250, 0.14); color: #7fb5f7; border: 1px solid rgba(96, 165, 250, 0.25); }
        .cat-chip.cat-project { background: rgba(45, 212, 191, 0.12); color: #5ed3c5; border: 1px solid rgba(45, 212, 191, 0.25); }
        .cat-chip.cat-urgent { background: rgba(248, 113, 113, 0.13); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.3); }

        .detail-card {
            background: rgba(150, 150, 168, 0.075);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 34px 38px;
            backdrop-filter: blur(18px) saturate(1.1);
            -webkit-backdrop-filter: blur(18px) saturate(1.1);
        }
        .detail-content {
            font-size: 0.95rem;
            line-height: 2.05;
            color: var(--text-secondary);
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .error-box {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-muted);
        }

        /* 页脚 */
        .footer {
            position: relative;
            z-index: 5;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
            padding: 34px 0;
            background: #040408;
            text-align: center;
        }
        .footer p { font-size: 0.78rem; color: var(--text-muted); }
        .footer a { color: var(--text-secondary); }
        .footer a:hover { color: #fff; }
        .footer .tiny { font-size: 0.62rem; opacity: 0.45; margin-top: 6px; }

        @media (max-width: 640px) {
            main { padding: 112px 0 70px; }
            .detail-card { padding: 24px 20px; border-radius: 16px; }
        }
        /* ===== 动画增强 ===== */
        @keyframes riseIn {
            from { opacity: 0; transform: translateY(26px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes auroraDrift1 { to { transform: translate(11vw, 9vh) scale(1.18); } }
        @keyframes auroraDrift2 { to { transform: translate(-12vw, -7vh) scale(1.12); } }
        .bg-aurora { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
        .bg-aurora::before, .bg-aurora::after { content: ""; position: absolute; width: 58vw; height: 58vw; border-radius: 50%; filter: blur(90px); opacity: 0.12; }
        .bg-aurora::before { top: -22vw; left: -16vw; background: radial-gradient(circle, #A78BFA 0%, transparent 65%); animation: auroraDrift1 26s ease-in-out infinite alternate; }
        .bg-aurora::after { bottom: -26vw; right: -14vw; background: radial-gradient(circle, #7C3AED 0%, transparent 65%); animation: auroraDrift2 34s ease-in-out infinite alternate; }
        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            .page-hero .container > *, .detail-wrap > *, .maintenance-card > * { animation: none; }
            .bg-aurora::before, .bg-aurora::after { animation: none; }
        }

        /* 详情区载入动画 */
        .detail-wrap > * { animation: riseIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) both; }
        .detail-wrap > *:nth-child(2) { animation-delay: 0.12s; }
        .detail-wrap > *:nth-child(3) { animation-delay: 0.24s; }
        /* ===== 进入/退出动画 ===== */
        @keyframes pageIn { from { opacity: 0; } to { opacity: 1; } }
        body { animation: pageIn 0.45s ease backwards; }
        body.page-exit { opacity: 0; transition: opacity 0.26s ease; }

        /* ===== 液态玻璃（右下角可开关） ===== */
        html.liquid-glass .navbar,
        html.liquid-glass .panel,
        html.liquid-glass .scenario-card,
        html.liquid-glass .timeline-card,
        html.liquid-glass .announce-card,
        html.liquid-glass .detail-card,
        html.liquid-glass .pan-card,
        html.liquid-glass .tut-step,
        html.liquid-glass .modal-body,
        html.liquid-glass .maintenance-card,
        html.liquid-glass .search-box {
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            background-image: linear-gradient(150deg, rgba(255,255,255,0.10), rgba(255,255,255,0.035) 42%, rgba(255,255,255,0.015));
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), inset 0 -1px 1px rgba(255,255,255,0.05), 0 12px 40px rgba(0,0,0,0.42);
        }        @media (prefers-reduced-motion: reduce) {
            body { animation: none; }
            body.page-exit { opacity: 1; transition: none; }
        }
    </style>
</head>
<body>
    <div class="bg-aurora" aria-hidden="true"></div>
    <script>try{localStorage.removeItem('tc-liquid-glass')}catch(e){};document.documentElement.classList.add('liquid-glass');</script>
    <div id="starfield"></div>

    <header class="navbar">
        <div class="container">
            <a href="index.html" class="navbar-brand" aria-label="返回首页">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <circle cx="12" cy="12" r="6.2" fill="#E9E4F5"/>
                    <ellipse cx="12" cy="12" rx="10.4" ry="3.4" stroke="#B9A8E8" stroke-width="1.3" transform="rotate(-18 12 12)"/>
                </svg>
                <span class="name">科技城存档</span>
            </a>
            <a href="announcements.html" class="nav-back">← 返回公告列表</a>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="detail-wrap">
                <a href="announcements.html" class="back-link">← 返回公告列表</a>
                <div class="detail-head">
                    <span class="tag">Announcement</span>
                    <h1 id="detail-title">公告标题</h1>
                    <p id="detail-date" class="date">日期</p>
                </div>
                <div class="detail-card">
                    <div id="detail-body" class="detail-content">内容加载中...</div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2026 <a href="index.html">科技城存档</a> · 构建方：螺旋科城基金会</p>
            <p class="tiny">© 2026 Spiral Kecheng Foundation · Minecraft 标志属于 Mojang Studios</p>
        </div>
    </footer>

    <script src="data/announcements.js?v=23"></script>
    <script>
        // ===== 星空生成 =====
        (function() {
            const sf = document.getElementById('starfield');
            const frag = document.createDocumentFragment();
            for (let i = 0; i < 70; i++) {
                const s = document.createElement('div');
                s.className = 'star';
                const size = Math.random() < 0.85 ? 1.5 : 2.5;
                s.style.width = size + 'px';
                s.style.height = size + 'px';
                s.style.left = (Math.random() * 100) + '%';
                s.style.top = (Math.random() * 100) + '%';
                s.style.setProperty('--d', (2.5 + Math.random() * 5).toFixed(2) + 's');
                s.style.setProperty('--o', (0.25 + Math.random() * 0.65).toFixed(2));
                s.style.animationDelay = (-Math.random() * 6).toFixed(2) + 's';
                frag.appendChild(s);
            }
            [[8, 20], [26, 55], [48, 12], [70, 40], [90, 24]].forEach(function(p, i) {
                const sp = document.createElement('div');
                sp.className = 'sparkle';
                const size = 9 + Math.random() * 7;
                sp.style.width = size + 'px';
                sp.style.height = size + 'px';
                sp.style.left = p[0] + '%';
                sp.style.top = p[1] + '%';
                sp.style.setProperty('--d', (3 + Math.random() * 4).toFixed(2) + 's');
                sp.style.animationDelay = (-i * 1.5).toFixed(2) + 's';
                frag.appendChild(sp);
            });
            sf.appendChild(frag);
        })();

        // ===== 加载公告详情 =====
        function loadDetail() {
            const params = new URLSearchParams(window.location.search);
            const id = parseInt(params.get('id'));
            const titleEl = document.getElementById('detail-title');
            const dateEl = document.getElementById('detail-date');
            const bodyEl = document.getElementById('detail-body');

            if (typeof announcements === 'undefined' || !Array.isArray(announcements)) {
                titleEl.textContent = '公告数据加载失败';
                dateEl.textContent = '';
                bodyEl.innerHTML = '<div class="error-box">⚠️ 请检查 <code>data/announcements.js</code> 是否存在。</div>';
                return;
            }
            const CAT_LABELS = { site: '网站公告', project: '项目动态', urgent: '紧急公告' };
            const item = announcements.find(function(a) { return a.id === id; });
            if (item) {
                const cat = CAT_LABELS[item.category] ? item.category : 'site';
                titleEl.textContent = item.title;
                dateEl.innerHTML = '<span class="cat-chip cat-' + cat + '">' + CAT_LABELS[cat] + '</span>' + item.date;
                bodyEl.innerHTML = '';
                bodyEl.innerHTML = item.body;  // 富文本渲染（支持公告内嵌图片）；换行由 .detail-content 的 white-space: pre-wrap 保留
                document.title = item.title + ' - 科技城存档 3.0';
            } else {
                titleEl.textContent = '公告未找到';
                dateEl.textContent = '';
                bodyEl.innerHTML = '<div class="error-box">抱歉，您访问的公告不存在，请返回列表查看其他公告。</div>';
            }
        }

        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            loadDetail();
        } else {
            document.addEventListener('DOMContentLoaded', loadDetail);
        }
    </script>
    <script>
        // ===== 页面进入/退出动画 =====
        (function() {
            if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            document.addEventListener('click', function(e) {
                if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
                var a = e.target.closest('a[href]');
                if (!a) return;
                var href = a.getAttribute('href') || '';
                if (!href || href.charAt(0) === '#' || /^(mailto|tel|javascript|blob|data):/i.test(href)) return;
                if (a.target === '_blank' || a.hasAttribute('download')) return;
                if (a.host && a.host !== location.host) return;
                if (a.pathname === location.pathname && a.hash) return;
                e.preventDefault();
                document.body.classList.add('page-exit');
                setTimeout(function() { location.href = a.href; }, 260);
            }, true);
            window.addEventListener('pageshow', function(ev) {
                if (ev.persisted) document.body.classList.remove('page-exit');
            });
        })();
    </script>
</body>
</html>
