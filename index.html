<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>网站维护中 - 科技城存档</title>
    <meta name="description" content="科技城存档网站正在升级3.0网站，敬请期待。">

    <script>
        (function() {
            try {
                const saved = localStorage.getItem('theme');
                const theme = (saved === 'light' || saved === 'dark') ? saved : 'light';
                document.documentElement.setAttribute('data-theme', theme);
                document.documentElement.style.backgroundColor = theme === 'dark' ? '#0D1E1C' : '#E8F4F2';
            } catch(e) {
                document.documentElement.setAttribute('data-theme', 'light');
                document.documentElement.style.backgroundColor = '#E8F4F2';
            }
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300..700&family=Playfair+Display:ital,wght@0,700;1,600&family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #1A7A6E;
            --primary-light: #2A9D8F;
            --accent: #1A7A6E;
            --accent-light: #5BBFB5;
            --accent-soft: rgba(26, 122, 110, 0.08);
            --accent-border: rgba(26, 122, 110, 0.18);

            --bg-body: #E8F4F2;
            --bg-card: #FFFFFF;
            --bg-elevated: #FFFFFF;

            --text-primary: #0D1E1C;
            --text-secondary: #3A5C58;
            --text-muted: #6B8C88;

            --glass-border: rgba(13, 30, 28, 0.08);
            --shadow-sm: 0 2px 12px rgba(13, 30, 28, 0.06);
            --shadow-md: 0 8px 32px rgba(13, 30, 28, 0.10);
            --shadow-glow: 0 0 70px rgba(26, 122, 110, 0.10);

            --glow-color: rgba(42, 157, 143, 0.10);
            --accent-glow: rgba(91, 191, 181, 0.10);
            --grid-color: rgba(13, 30, 28, 0.02);

            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-pill: 100px;

            --font: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            --font-serif: 'Playfair Display', 'Songti SC', Georgia, serif;

            --silk: cubic-bezier(0.16, 1, 0.3, 1);
        }

        [data-theme="dark"] {
            --primary: #2A9D8F;
            --primary-light: #5BBFB5;
            --accent: #5BBFB5;
            --accent-light: #5BBFB5;
            --accent-soft: rgba(42, 157, 143, 0.12);
            --accent-border: rgba(91, 191, 181, 0.25);

            --bg-body: #0D1E1C;
            --bg-card: #16302D;
            --bg-elevated: #16302D;

            --text-primary: #E8F4F2;
            --text-secondary: #9FB8B4;
            --text-muted: #5F7B77;

            --glass-border: rgba(232, 244, 242, 0.08);
            --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.25);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.35);
            --shadow-glow: 0 0 70px rgba(42, 157, 143, 0.12);

            --glow-color: rgba(42, 157, 143, 0.10);
            --accent-glow: rgba(91, 191, 181, 0.08);
            --grid-color: rgba(232, 244, 242, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }

        body {
            font-family: var(--font);
            background: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            padding-top: calc(20px + env(safe-area-inset-top, 0px));
            padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            transition: background 0.6s ease, color 0.6s ease;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 15% 20%, var(--glow-color) 0%, transparent 55%),
                radial-gradient(ellipse at 85% 80%, var(--accent-glow) 0%, transparent 45%);
            pointer-events: none;
            z-index: 0;
            transition: background 0.6s ease;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.25;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
            background-size: 256px 256px;
            mix-blend-mode: overlay;
        }
        [data-theme="light"] body::after { opacity: 0.08; }

        .theme-toggle {
            position: fixed;
            top: calc(20px + env(safe-area-inset-top, 0px));
            right: 20px;
            width: 44px;
            height: 44px;
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: all 0.3s var(--silk);
            box-shadow: var(--shadow-sm);
        }
        .theme-toggle:hover {
            border-color: var(--accent-border);
            color: var(--primary);
            transform: rotate(20deg);
        }

        .maintenance-card {
            position: relative;
            z-index: 1;
            max-width: 620px;
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            padding: 56px 48px;
            text-align: center;
            transition: background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
        }
        .maintenance-card:hover {
            border-color: var(--accent-border);
            box-shadow: var(--shadow-md), var(--shadow-glow);
        }

        .icon { font-size: 4.5rem; display: block; margin-bottom: 18px; line-height: 1; }
        h1 {
            font-family: var(--font-serif);
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 14px;
            letter-spacing: 0.5px;
            transition: color 0.4s ease;
        }
        h1 .highlight {
            background: linear-gradient(135deg, var(--primary), var(--accent-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .description {
            font-size: 1.05rem;
            line-height: 1.85;
            color: var(--text-secondary);
            margin-bottom: 24px;
            transition: color 0.4s ease;
        }
        .description strong { color: var(--text-primary); font-weight: 600; }
        .badge {
            display: inline-block;
            padding: 7px 22px;
            background: var(--accent-soft);
            border: 1.5px solid var(--accent-border);
            border-radius: var(--radius-pill);
            color: var(--primary);
            font-weight: 600;
            font-size: 0.8rem;
            letter-spacing: 1px;
            margin-bottom: 22px;
        }
        .eta {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 28px;
        }
        .eta strong { color: var(--text-secondary); }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 36px;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            text-decoration: none;
            border: 1px solid transparent;
            border-radius: var(--radius-pill);
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: #FFFFFF;
            box-shadow: 0 6px 24px rgba(26, 122, 110, 0.22);
            transition: transform 0.3s var(--silk), box-shadow 0.3s var(--silk);
            cursor: pointer;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 32px rgba(26, 122, 110, 0.30);
        }
        .footer-text {
            margin-top: 36px;
            font-size: 0.78rem;
            color: var(--text-muted);
            border-top: 1px solid var(--glass-border);
            padding-top: 22px;
        }
        .footer-text a { color: var(--primary); text-decoration: none; }

        @media (max-width: 480px) {
            .maintenance-card { padding: 40px 24px; border-radius: 20px; }
            h1 { font-size: 1.7rem; }
            .icon { font-size: 3.5rem; margin-bottom: 14px; }
            .description { font-size: 0.98rem; }
            .btn { display: flex; width: 100%; padding: 14px 24px; }
            .theme-toggle { width: 40px; height: 40px; font-size: 1.1rem; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; }
        }
    </style>
</head>
<body>

    <button class="theme-toggle" id="theme-toggle" aria-label="切换主题">🌙</button>

    <div class="maintenance-card">
        <span class="icon">🔧</span>
        <h1><span class="highlight">科技城</span> 维护中</h1>
        <div class="badge">⏳ 正在升级</div>
        <p class="description">我们正在对网站进行<strong>升级3.0网站</strong>，以提供更好的体验。<br>预计很快恢复，感谢你的耐心等待！</p>
        <p class="eta">⏱️ 预计恢复时间：<strong>2026年10月17日 18:00前</strong></p>
        <a href="mailto:kjsofficial@foxmail.com" class="btn">📧 联系客服</a>
        <div class="footer-text">© 2026 <a href="#">科技城存档</a> · 维护期间全部功能暂不可用</div>
    </div>

    <script>
        (function() {
            const btn = document.getElementById('theme-toggle');
            if (btn) {
                const saved = localStorage.getItem('theme') || 'light';
                btn.textContent = saved === 'dark' ? '☀️' : '🌙';
                btn.addEventListener('click', function() {
                    const current = document.documentElement.getAttribute('data-theme') || 'light';
                    const next = current === 'dark' ? 'light' : 'dark';
                    document.documentElement.setAttribute('data-theme', next);
                    localStorage.setItem('theme', next);
                    this.textContent = next === 'dark' ? '☀️' : '🌙';
                    document.documentElement.style.backgroundColor = next === 'dark' ? '#0D1E1C' : '#E8F4F2';
                });
            }
        })();
    </script>
</body>
</html>
