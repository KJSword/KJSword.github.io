    <!-- 防闪黑：在渲染前设置主题 -->
    <script>
        (function() {
            try {
                const saved = localStorage.getItem('theme');
                const theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
                document.documentElement.setAttribute('data-theme', theme);
                document.documentElement.style.backgroundColor = theme === 'dark' ? '#080C14' : '#EEF2F6';
            } catch(e) {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.documentElement.style.backgroundColor = '#080C14';
            }
        })();
    </script>

    <style>
        .download-card {
            max-width: 580px;
            margin: 0 auto;
            padding: 40px 32px;
            text-align: center;
        }
        .download-card .icon { font-size: 4.5rem; display: block; margin-bottom: 14px; }
        .download-card h3 { font-size: 1.4rem; font-weight: 700; color: var(--text-primary); margin-bottom: 6px; }
        .download-card p { color: var(--text-secondary); font-size: 0.92rem; line-height: 1.8; }
        .download-card .file-info {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            margin: 16px 0 24px;
        }
        .download-card .file-info span {
            padding: 4px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .download-card .btn-download {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 40px;
            font-size: 1.05rem;
            font-weight: 700;
            font-family: var(--font);
            border: none;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: #fff;
            cursor: pointer;
            box-shadow: 0 4px 24px rgba(79, 195, 247, 0.15);
            transition: all 0.3s ease;
            text-decoration: none;
        }
        .download-card .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(79, 195, 247, 0.25);
        }
        .download-card .alt-text {
            margin-top: 14px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .download-card .alt-text a { color: var(--primary); }
    </style>
